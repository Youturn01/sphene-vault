[workspace]
resolver = "2"
members = [
    "contracts/compliance",
    "contracts/mock-usdc",
    "contracts/receipt-token",
    "contracts/vault",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92.0"
license = "MIT"
publish = false

# Matches the profile used by the Stellar soroban-examples token contract.
# `stellar contract build` is still the command that should produce deployable Wasm.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
